<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main>
        <div class="container">
            <div class="title"><h1>Bem-vindo de volta!</h1><span style='font-size:40px;'>&#128075;</span><p>Faça login para continuar</p></div>

            <form>
                <div class="input-field" id="input-email">
                    <p><strong>E-mail</strong></p>
                    <label>Email ou Username</label>
                    <input id="input-email" type="email">
                </div>
                <div class="input-field">
                    <p><strong>Senha</strong></p>
                    <label>Senha</label>
                    <input type="password">
                </div>
            </form>
            <div class="button">
                <div class="inner"></div>
                <button>Fazer login</button>
            </div>
        </div>
    </main>

</body>
</html>
