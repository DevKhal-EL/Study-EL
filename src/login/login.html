<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main>
        <div class="container">
            <div class="title"><h1>Bem-vindo de volta!</h1><span style='font-size:40px;'>&#128075;</span><p>Faça login para continuar</p></div>

            <form>
                <div class="input-field" id="input-email">
                    <label>E-mail</label>
                    <input id="input-email" type="email" placeholder="seu@email.com">
                </div>
                <div class="input-field">
                    <label>Senha</label>
                    <input id="input-password" type="password" placeholder="**********">
                </div>
                <div class="button">
                    <button class="btn-entrar">Entrar</button>
                </div>
            </form>

        </div>
    </main>

</body>
</html>
